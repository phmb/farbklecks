<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Farbklecks: Mische Zielfarben aus RGB-Licht oder CMYK-Tinte so genau wie möglich nach.">
<meta name="theme-color" content="#E8E6EF">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Farbklecks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Mono:wght@500&family=DM+Sans:opsz,wght@9..40,500;9..40,700;9..40,800&display=swap">
<style>
/* Layout: ein Bildschirm als Laborbank – oben Farbmuster-Kärtchen gegen Klecks-Figur, darunter Reagenzglas-Regler, Sticker-Look mit dicken Konturen */
:root{
  --bg:#E8E6EF; --surface:#FFFFFF; --ink:#1E1A2A; --muted:#625C78; --edge:#1E1A2A;
  --accent:#FFC83D; --accent-ink:#1E1A2A; --pop:#FF4F8B; --soft:#D8D4E4;
  --glass-light:#FFFFFF; --glass-dark:#16131D; --scrim:rgba(24,18,36,.5);
  --f-display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --swatch-h:clamp(100px,18vh,190px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16141D; --surface:#25222F; --ink:#F2EFF8; --muted:#A7A1BC; --edge:#000000;
    --soft:#34303F; --glass-light:#F3F1F7; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16141D; --surface:#25222F; --ink:#F2EFF8; --muted:#A7A1BC; --edge:#000000;
  --soft:#34303F; --glass-light:#F3F1F7; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px;
  -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none;
  overscroll-behavior:none;
}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,.tube:focus-visible{outline:3px solid var(--pop); outline-offset:3px}

.app{
  min-height:100%; max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:12px;
  padding-block:10px 14px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}

/* Kopfzeile */
.top{display:flex; align-items:center; justify-content:space-between; gap:10px}
.brand{font-family:var(--f-display); font-size:1.7rem; line-height:1; margin:0; font-weight:400; letter-spacing:.01em; white-space:nowrap}
.brand span{color:var(--c); -webkit-text-stroke:2px var(--edge); paint-order:stroke fill; text-shadow:2px 2px 0 var(--edge)}
.rounds{display:flex; gap:6px}
.dot{width:15px; height:15px; border-radius:50%; border:2.5px solid var(--edge); background:var(--surface); transition:background .3s}
.dot.cur{box-shadow:0 0 0 3px var(--accent)}
.score{display:flex; flex-direction:column; align-items:flex-end; line-height:1}
.score small{font-size:.66rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:700}
.score b{font-family:var(--f-display); font-weight:400; font-size:1.45rem; font-variant-numeric:tabular-nums}

.bar{display:flex; gap:8px; align-items:center}
@media (max-width:440px){.seg button small{display:none} .seg button{padding:7px 11px} .chip{padding:7px 10px}}
.seg{display:flex; border:2.5px solid var(--edge); border-radius:999px; overflow:hidden; background:var(--surface); box-shadow:3px 3px 0 var(--edge)}
.seg button{border:0; background:none; padding:7px 13px; font-weight:800; display:flex; gap:5px; align-items:baseline}
.seg button small{font-weight:500; font-size:.72rem; opacity:.75}
.seg button[aria-checked="true"]{background:var(--ink); color:var(--bg)}
.chip{border:2.5px solid var(--edge); border-radius:999px; background:var(--surface); padding:7px 12px; font-weight:800; box-shadow:3px 3px 0 var(--edge); display:flex; gap:6px; align-items:center}
.chip[aria-pressed="true"]{background:var(--pop); color:#fff}
.chip .box{width:14px; height:14px; border-radius:4px; border:2px solid currentColor; display:inline-grid; place-items:center; font-size:10px; line-height:1}
.icon-btn{margin-left:auto; width:40px; height:40px; border-radius:50%; border:2.5px solid var(--edge); background:var(--surface); box-shadow:3px 3px 0 var(--edge); display:grid; place-items:center; padding:0}
.icon-btn svg{width:20px; height:20px}
.icon-btn[aria-pressed="false"] .on,.icon-btn[aria-pressed="true"] .off{display:none}

/* Bühne */
.stage{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start}
.chipcard{
  margin:0; background:var(--surface); border:2.5px solid var(--edge); border-radius:14px;
  box-shadow:4px 4px 0 var(--edge); padding:8px 8px 10px; display:flex; flex-direction:column; gap:8px;
  transform:rotate(-1.6deg); position:relative; min-width:0;
}
.chipcard::before{content:""; position:absolute; top:-7px; left:50%; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:var(--bg); border:2.5px solid var(--edge); z-index:2}
.chip-swatch{height:var(--swatch-h); border-radius:8px; border:2px solid var(--edge); position:relative; overflow:hidden; transition:background .4s}
.chipcard figcaption{display:flex; flex-direction:column; gap:2px; min-width:0}
.chip-no{font-family:var(--f-mono); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.chip-name{font-weight:800; font-size:.93rem; line-height:1.15; text-wrap:balance; min-height:2.3em}
.mem-cover{position:absolute; inset:0; display:grid; place-items:center; align-content:center; gap:4px; background:repeating-linear-gradient(45deg,var(--soft) 0 10px,var(--surface) 10px 20px); font-family:var(--f-display); font-size:3rem; color:var(--ink); text-align:center}
.mem-cover small{font-family:var(--f-body); font-size:.75rem; font-weight:800}
.mem-bar{position:absolute; left:0; bottom:0; height:6px; width:100%; background:var(--ink); transform-origin:left}
.mem-bar.run{animation:shrink 3s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}

.blobwrap{position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0}
.blob{width:100%; height:calc(var(--swatch-h) + 28px); overflow:visible; display:block}
.blob-body{transition:fill .12s}
.blob-g{transform-box:fill-box; transform-origin:50% 100%}
.blob-g.squish{animation:squish .38s ease-out}
@keyframes squish{30%{transform:scale(1.07,.92)}60%{transform:scale(.97,1.04)}100%{transform:none}}
.blob-g.jump{animation:jump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{30%{transform:translateY(-14px) scale(.95,1.06)}55%{transform:translateY(0) scale(1.08,.9)}100%{transform:none}}
.eyes{transform-box:fill-box; transform-origin:center; transition:transform .08s}
.eyes.blink{transform:scaleY(.1)}
.pupil{transition:transform .15s}
.blob-label{font-family:var(--f-mono); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.bubble{
  position:absolute; top:-8px; right:-4px; max-width:calc(100% + 8px); z-index:3;
  background:var(--surface); border:2.5px solid var(--edge); border-radius:14px; padding:6px 10px;
  font-weight:800; font-size:.84rem; line-height:1.2; box-shadow:3px 3px 0 var(--edge);
  opacity:0; transform:translateY(6px) scale(.9); transition:opacity .2s, transform .25s cubic-bezier(.3,1.6,.5,1); pointer-events:none;
}
.bubble.show{opacity:1; transform:none}

/* Reagenzgläser */
.modeline{margin:0; font-size:.8rem; color:var(--muted); font-weight:700; text-align:center}
.modeline b{color:var(--ink)}
.tubes{flex:1; display:grid; grid-template-columns:repeat(var(--n,3),minmax(0,1fr)); gap:10px; min-height:236px}
.tubecol{display:flex; flex-direction:column; align-items:center; gap:6px; min-height:0; --c:#888}
.tube{flex:1; width:100%; max-width:76px; display:flex; touch-action:none; cursor:ns-resize; border-radius:10px 10px 40px 40px; min-height:150px}
.glass{
  position:relative; flex:1; border:3px solid var(--edge); border-radius:8px 8px 36px 36px / 8px 8px 30px 30px;
  background:var(--glass); overflow:hidden; box-shadow:3px 3px 0 var(--edge);
}
.mode-rgb{--glass:var(--glass-dark); --tick:rgba(255,255,255,.28)}
.mode-cmyk{--glass:var(--glass-light); --tick:rgba(30,26,42,.22)}
.fill{position:absolute; left:0; right:0; bottom:0; height:0; background:var(--c)}
.mode-rgb .fill{box-shadow:0 0 26px 6px var(--c)}
.wave{position:absolute; left:-20px; right:-20px; top:-6px; height:14px; background:radial-gradient(circle at 10px 10px, var(--c) 7px, transparent 7.6px) repeat-x; background-size:20px 14px; animation:wave 1.5s linear infinite}
.fill.empty .wave{display:none}
@keyframes wave{to{transform:translateX(20px)}}
.ticks{position:absolute; right:7px; top:6px; bottom:14px; width:9px; background:repeating-linear-gradient(to top, transparent 0 calc(10% - 2px), var(--tick) calc(10% - 2px) 10%)}
.shine{position:absolute; top:10px; bottom:22px; left:17%; width:6px; border-radius:6px; background:rgba(255,255,255,.5)}
.tubecol.nudge .glass{animation:nudge .5s ease-in-out 3}
@keyframes nudge{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.tube-lbl{display:flex; align-items:center; gap:5px; font-family:var(--f-mono); font-size:.86rem; font-variant-numeric:tabular-nums}
.tube-lbl b{font-family:var(--f-display); font-weight:400; font-size:1.1rem}
.tube-lbl .sw{width:11px; height:11px; border-radius:50%; background:var(--c); border:2px solid var(--edge)}
.steppers{display:flex; gap:6px}
.step{width:33px; height:33px; border-radius:10px; border:2.5px solid var(--edge); background:var(--surface); font-weight:800; font-size:1.15rem; line-height:1; box-shadow:2px 2px 0 var(--edge); padding:0; touch-action:manipulation}
.step:active{transform:translate(2px,2px); box-shadow:none}

/* Knöpfe */
.actions{display:grid; grid-template-columns:auto 1fr; gap:12px}
.btn{
  font-family:var(--f-display); font-weight:400; font-size:1.25rem; padding:12px 18px; border-radius:16px;
  border:3px solid var(--edge); box-shadow:4px 4px 0 var(--edge); background:var(--surface); color:var(--ink);
  transition:transform .06s, box-shadow .06s; touch-action:manipulation; line-height:1.1;
}
.btn small{font-family:var(--f-body); font-weight:800; font-size:.8rem}
.btn.primary{background:var(--accent); color:var(--accent-ink)}
.btn:active:not(:disabled){transform:translate(3px,3px); box-shadow:1px 1px 0 var(--edge)}
.btn:disabled{opacity:.45; cursor:default}

/* Auswertung */
.backdrop{position:fixed; inset:0; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center; z-index:20}
.sheet{
  width:100%; max-width:560px; max-height:92%; overflow:auto; background:var(--surface);
  border:3px solid var(--edge); border-bottom:0; border-radius:26px 26px 0 0;
  padding-block:20px calc(18px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px, env(safe-area-inset-left,0px)); padding-right:max(18px, env(safe-area-inset-right,0px));
  display:flex; flex-direction:column; gap:12px; animation:up .4s cubic-bezier(.2,1.25,.4,1);
}
@keyframes up{from{transform:translateY(100%)}}
.res-swatch{display:grid; grid-template-columns:1fr 1fr; height:104px; border:3px solid var(--edge); border-radius:16px; overflow:hidden}
.res-swatch div{position:relative}
.res-swatch span{position:absolute; left:8px; bottom:8px; background:var(--surface); border:2px solid var(--edge); border-radius:999px; padding:2px 9px; font-weight:800; font-size:.75rem}
.res-head{display:flex; align-items:center; justify-content:space-between; gap:12px}
.res-score{font-family:var(--f-display); font-size:3.6rem; line-height:.9; font-variant-numeric:tabular-nums}
.res-score small{font-size:1.1rem; color:var(--muted)}
.stars{display:flex; gap:4px}
.stars svg{width:34px; height:34px}
.stars .full{fill:var(--accent)} .stars .empty{fill:var(--soft)}
.stars path{stroke:var(--edge); stroke-width:2.5; stroke-linejoin:round}
.comment{margin:0; font-size:1.15rem; font-weight:800; line-height:1.3; text-wrap:balance}
.detail{margin:0; color:var(--muted); font-size:.9rem; line-height:1.45}
.detail b{color:var(--ink)}
.recipe{width:100%; border-collapse:collapse; font-family:var(--f-mono); font-size:.86rem; font-variant-numeric:tabular-nums}
.recipe th,.recipe td{padding:5px 6px; text-align:right; border-bottom:1.5px solid var(--soft)}
.recipe th:first-child,.recipe td:first-child{text-align:left}
.recipe th{font-family:var(--f-body); font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.recipe .sw{display:inline-block; width:10px; height:10px; border-radius:50%; border:2px solid var(--edge); margin-right:6px; vertical-align:-1px}
.penalty{color:var(--pop); font-weight:800}
.rank-eyebrow{margin:0; font-size:.75rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:800}
.rank{margin:0; font-family:var(--f-display); font-weight:400; font-size:2.1rem; line-height:1.05; text-wrap:balance}
.history{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px}
.hist{display:flex; flex-direction:column; align-items:center; gap:4px}
.hist .pair{width:100%; aspect-ratio:1; max-width:100%; border-radius:12px; border:2.5px solid var(--edge); overflow:hidden; display:grid; grid-template-columns:1fr 1fr}
.hist b{font-family:var(--f-mono); font-size:.85rem}
.badge{display:inline-block; background:var(--pop); color:#fff; border:2px solid var(--edge); border-radius:999px; padding:2px 9px; font-weight:800; font-size:.8rem; transform:rotate(-3deg)}
.sheet-actions{display:grid; grid-template-columns:1fr; gap:10px}
@media (min-width:420px){.sheet-actions.two{grid-template-columns:1fr 1fr}}

#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:30}

@media (max-height:640px){:root{--swatch-h:96px} .tubes{min-height:200px} .tube{min-height:120px}}
@media (prefers-reduced-motion: reduce){
  .wave,.blob-g.squish,.blob-g.jump,.tubecol.nudge .glass,.sheet{animation:none}
}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <h1 class="brand" aria-label="Farbklecks"><span style="--c:#00B4F0">F</span><span style="--c:#F0148C">a</span><span style="--c:#FFE500">r</span><span style="--c:#FF2D2D">b</span><span style="--c:#2BE04A">k</span><span style="--c:#2F6BFF">l</span><span style="--c:#00B4F0">e</span><span style="--c:#F0148C">c</span><span style="--c:#FFE500">k</span><span style="--c:#FF2D2D">s</span></h1>
    <div class="rounds" id="rounds" aria-label="Runden"></div>
    <div class="score"><small>Punkte</small><b id="total">0</b></div>
  </header>

  <div class="bar">
    <div class="seg" role="radiogroup" aria-label="Farbmodell">
      <button type="button" role="radio" id="modeRgb" data-mode="rgb" aria-checked="true">RGB <small>Licht</small></button>
      <button type="button" role="radio" id="modeCmyk" data-mode="cmyk" aria-checked="false">CMYK <small>Tinte</small></button>
    </div>
    <button type="button" class="chip" id="memBtn" aria-pressed="false"><span class="box" id="memBox"></span>Gedächtnis</button>
    <button type="button" class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="Ton an oder aus">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
  </div>

  <section class="stage">
    <figure class="chipcard">
      <div class="chip-swatch" id="targetSwatch">
        <div class="mem-cover" id="memCover" hidden>?<small>Aus dem Gedächtnis!</small></div>
        <div class="mem-bar" id="memBar" hidden></div>
      </div>
      <figcaption>
        <span class="chip-no" id="chipNo">Farbton 1 von 5</span>
        <span class="chip-name" id="targetName">Tomate mit Sonnenbrand</span>
      </figcaption>
    </figure>

    <div class="blobwrap" id="blobwrap">
      <div class="bubble" id="bubble" role="status" aria-live="polite"></div>
      <svg class="blob" id="blob" viewBox="0 0 200 210" aria-label="Dein Mix">
        <ellipse cx="100" cy="200" rx="62" ry="6" fill="var(--edge)" opacity=".15"/>
        <g class="blob-g" id="blobG">
          <path class="blob-body" id="blobBody" fill="#000" stroke="var(--edge)" stroke-width="5" stroke-linejoin="round"
            d="M100 22C147 22 178 54 178 100C178 130 169 150 157 162C150 169 153 183 144 186C135 189 135 174 127 174C116 178 112 189 100 189C86 189 81 178 71 176C62 175 60 189 50 185C41 181 46 168 40 160C28 146 22 126 22 100C22 54 54 22 100 22Z"/>
          <ellipse cx="60" cy="122" rx="11" ry="7" fill="var(--pop)" opacity=".45"/>
          <ellipse cx="140" cy="122" rx="11" ry="7" fill="var(--pop)" opacity=".45"/>
          <g class="eyes" id="eyes">
            <circle cx="78" cy="94" r="15" fill="#fff" stroke="var(--edge)" stroke-width="4"/>
            <circle cx="122" cy="94" r="15" fill="#fff" stroke="var(--edge)" stroke-width="4"/>
            <circle class="pupil" cx="78" cy="94" r="6.5" fill="#1E1A2A"/>
            <circle class="pupil" cx="122" cy="94" r="6.5" fill="#1E1A2A"/>
          </g>
          <path id="mouth" d="M88 130Q100 137 112 130" fill="none" stroke="var(--edge)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
      <span class="blob-label">Dein Mix</span>
    </div>
  </section>

  <p class="modeline" id="modeline"></p>
  <section class="tubes" id="tubes" aria-label="Farbregler"></section>

  <div class="actions">
    <button type="button" class="btn" id="hintBtn">Tipp <small id="hintCount">2×</small></button>
    <button type="button" class="btn primary" id="goBtn">Fertig gemischt!</button>
  </div>
</div>

<div class="backdrop" id="sheetWrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Auswertung"></div>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(() => {
const $ = s => document.querySelector(s);
const ROUNDS = 5;
const CH = {
  rgb: [
    {k:'R', name:'Rot',   c:'#FF2D2D', max:255},
    {k:'G', name:'Grün',  c:'#2BE04A', max:255},
    {k:'B', name:'Blau',  c:'#2F6BFF', max:255}],
  cmyk: [
    {k:'C', name:'Cyan',    c:'#00B4F0', max:100},
    {k:'M', name:'Magenta', c:'#F0148C', max:100},
    {k:'Y', name:'Gelb',    c:'#FFE500', max:100},
    {k:'K', name:'Schwarz', c:'#2A2630', max:100}]
};
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const de = n => n.toFixed(1).replace('.', ',');

/* ---------- Farbmathe ---------- */
function mix(mode, v){
  if (mode === 'rgb') return v.slice();
  const k = 1 - v[3] / 100;
  return [0,1,2].map(i => Math.round(255 * (1 - v[i] / 100) * k));
}
const hex = c => '#' + c.map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
const css = c => `rgb(${c[0]},${c[1]},${c[2]})`;
function lab([r,g,b]){
  const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  const R = lin(r), G = lin(g), B = lin(b);
  const X = (R*0.4124564 + G*0.3575761 + B*0.1804375) / 0.95047;
  const Y = (R*0.2126729 + G*0.7151522 + B*0.0721750);
  const Z = (R*0.0193339 + G*0.1191920 + B*0.9503041) / 1.08883;
  const f = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  return [116*f(Y) - 16, 500*(f(X) - f(Y)), 200*(f(Y) - f(Z))];
}
function deltaE(c1, c2){ // CIEDE2000
  const [L1,a1,b1] = lab(c1), [L2,a2,b2] = lab(c2);
  const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
  const C1 = Math.hypot(a1,b1), C2 = Math.hypot(a2,b2), Cb = (C1 + C2) / 2;
  const G = 0.5 * (1 - Math.sqrt(Cb**7 / (Cb**7 + 25**7)));
  const a1p = (1+G)*a1, a2p = (1+G)*a2;
  const C1p = Math.hypot(a1p,b1), C2p = Math.hypot(a2p,b2);
  const hp = (b, a) => (a === 0 && b === 0) ? 0 : (deg(Math.atan2(b, a)) + 360) % 360;
  const h1p = hp(b1,a1p), h2p = hp(b2,a2p);
  const dLp = L2 - L1, dCp = C2p - C1p;
  let dhp = 0;
  if (C1p * C2p !== 0){ dhp = h2p - h1p; if (dhp > 180) dhp -= 360; else if (dhp < -180) dhp += 360; }
  const dHp = 2 * Math.sqrt(C1p * C2p) * Math.sin(rad(dhp / 2));
  const Lbp = (L1 + L2) / 2, Cbp = (C1p + C2p) / 2;
  let hbp = h1p + h2p;
  if (C1p * C2p !== 0){
    hbp = Math.abs(h1p - h2p) <= 180 ? (h1p + h2p) / 2 : (h1p + h2p < 360 ? (h1p + h2p + 360) / 2 : (h1p + h2p - 360) / 2);
  }
  const T = 1 - 0.17*Math.cos(rad(hbp - 30)) + 0.24*Math.cos(rad(2*hbp)) + 0.32*Math.cos(rad(3*hbp + 6)) - 0.20*Math.cos(rad(4*hbp - 63));
  const dTh = 30 * Math.exp(-(((hbp - 275) / 25) ** 2));
  const Rc = 2 * Math.sqrt(Cbp**7 / (Cbp**7 + 25**7));
  const Sl = 1 + 0.015 * (Lbp - 50)**2 / Math.sqrt(20 + (Lbp - 50)**2);
  const Sc = 1 + 0.045 * Cbp, Sh = 1 + 0.015 * Cbp * T;
  const Rt = -Math.sin(rad(2 * dTh)) * Rc;
  return Math.sqrt((dLp/Sl)**2 + (dCp/Sc)**2 + (dHp/Sh)**2 + Rt * (dCp/Sc) * (dHp/Sh));
}
function hsl([r,g,b]){
  r/=255; g/=255; b/=255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx + mn) / 2, d = mx - mn;
  let h = 0, s = 0;
  if (d){
    s = d / (1 - Math.abs(2*l - 1));
    h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h = (h * 60 + 360) % 360;
  }
  return [h, s, l];
}
function fromHsl(h, s, l){
  const c = (1 - Math.abs(2*l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  const [r,g,b] = h < 60 ? [c,x,0] : h < 120 ? [x,c,0] : h < 180 ? [0,c,x] : h < 240 ? [0,x,c] : h < 300 ? [x,0,c] : [c,0,x];
  return [r,g,b].map(v => Math.round((v + m) * 255));
}

function nameFor(rgb){
  const [h, s, l] = hsl(rgb);
  const tone = l < 0.28 ? 'dark' : l > 0.74 ? 'light' : 'mid';
  const noun = s < 0.12 ? pick(GREYS[tone]) : pick(NOUNS.find(([lim]) => h < lim)[1]);
  return `${noun} ${pick(SUFFIX[tone])}`;
}

/* ---------- Zustand ---------- */
let state;
let best = {};
try { best = JSON.parse(localStorage.getItem('farbklecks-best') || '{}') || {}; } catch(e){ best = {}; }
const bestKey = () => state.mode + (state.memory ? '-gedaechtnis' : '');

function startVals(mode){ return mode === 'rgb' ? [0,0,0] : [0,0,0,0]; }

function makeTarget(mode){
  const prev = state.results.map(r => r.target);
  const start = mix(mode, startVals(mode));
  let t;
  for (let tries = 0; tries < 40; tries++){
    let vals, rgb;
    if (mode === 'rgb'){
      const grey = Math.random() < 0.08;
      rgb = fromHsl(Math.random() * 360, grey ? Math.random() * 0.08 : 0.3 + Math.random() * 0.7, 0.18 + Math.random() * 0.64);
      vals = rgb.slice();
    } else {
      vals = [0,1,2].map(() => Math.random() < 0.25 ? 0 : Math.round(Math.random() * 20) * 5);
      vals.push(Math.random() < 0.6 ? 0 : 5 + Math.round(Math.random() * 9) * 5);
      rgb = mix('cmyk', vals);
    }
    t = {vals, rgb, name: nameFor(rgb)};
    const L = lab(rgb)[0];
    if (L < 12 || L > 94) continue;
    if (deltaE(rgb, start) < 18) continue;
    if (prev.some(p => deltaE(p, rgb) < 14)) continue;
    break;
  }
  return t;
}

function newGame(mode, memory){
  clearTimeout(memTimer);
  state = {mode, memory, round:0, results:[], jokers:2, total:0, sound: state ? state.sound : true};
  newRound();
}
function newRound(){
  state.target = makeTarget(state.mode);
  state.vals = startVals(state.mode);
  state.hintsUsed = 0;
  state.phase = 'play';
  state.memHidden = false;
  closeSheet();
  buildTubes();
  renderTarget();
  setMood('neutral');
  render();
  const greet = state.mode === 'rgb'
    ? ['Licht aus! Mach mich hell.','Hier ist es so dunkel …','Dreh die Lampen auf!']
    : ['Ich bin ein leeres Blatt.','Tinte her, bitte!','Bemal mich!'];
  say(state.round === 0 ? pick(greet) : pick(['Nächste Farbe, los!','Mach mich hübsch.','Ich will so aussehen wie das da!','Diesmal klappt\'s!']));
  if (state.memory) startMemory();
}

function buildTubes(){

}
function fmtVal(i){
  const v = state.vals[i];
  return state.mode === 'rgb' ? String(v) : v + ' %';
}
function renderTubes(){
  const chs = CH[state.mode];
  document.querySelectorAll('.tubecol').forEach((col, i) => {
    const v = state.vals[i], f = col.querySelector('.fill'), t = col.querySelector('.tube');
    f.style.height = (v / chs[i].max * 100) + '%';
    f.classList.toggle('empty', v === 0);
    col.querySelector('.val').textContent = fmtVal(i);

    t.setAttribute('aria-valuetext', fmtVal(i));

function renderBlob(){ $('#blobBody').style.fill = css(mix(state.mode, state.vals)); }
function renderTarget(){

function render(){

/* ---------- Ton ---------- */
let ac;
function audio(){
  if (!state.sound) return null;
  if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f, at = 0, dur = 0.12, type = 'sine', vol = 0.08, to){
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.03);
}
let lastTick = 0;
function tick(frac){
  const n = performance.now(); if (n - lastTick < 45) return; lastTick = n;
  tone(260 + frac * 760, 0, 0.05, 'triangle', 0.035);
}
const blop = (f = 420, d = 0.16) => tone(f, 0, d, 'sine', 0.12, f * 2.2);
const fanfare = () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.085, 0.22, 'triangle', 0.07));
const okSound = () => [440, 554, 659].forEach((f, i) => tone(f, i * 0.1, 0.18, 'triangle', 0.06));
const sadSound = () => [392, 370, 349, 262].forEach((f, i) => tone(f, i * 0.2, i === 3 ? 0.5 : 0.2, 'sawtooth', 0.035));

/* ---------- Bedienung ---------- */
let dragI = null;
function setVal(i, v){
  if (state.phase !== 'play') return;
  const max = CH[state.mode][i].max;
  v = clamp(Math.round(v), 0, max);
  if (state.vals[i] === v) return;
  state.vals[i] = v;
  renderTubes(); renderBlob();
  tick(v / max);
}
function lookAtTube(i){
  const col = document.querySelectorAll('.tubecol')[i];
  if (!col) return;
  const cr = col.getBoundingClientRect(), br = $('#blob').getBoundingClientRect();
  look(clamp((cr.left + cr.width / 2 - (br.left + br.width / 2)) / 25, -6, 6), 5);
}
function bindTubes(){
  document.querySelectorAll('.tube').forEach(t => {
    const i = +t.dataset.i;
    const fromY = e => {
      const r = t.querySelector('.glass').getBoundingClientRect(), pad = 8;
      setVal(i, (1 - (e.clientY - r.top - pad) / (r.height - 2 * pad)) * CH[state.mode][i].max);
    };
    t.addEventListener('pointerdown', e => {
      if (state.phase !== 'play') return;
      e.preventDefault();
      t.setPointerCapture(e.pointerId); t.focus({preventScroll:true});
      dragI = i; lookAtTube(i); setMood('o'); fromY(e);
      if (Math.random() < 0.12) say(pick(['Hihi, das kitzelt!','Uiii!','Mehr! Mehr!','Vorsicht, ich bin empfindlich.','Blubb.']), 1400);
    });
    t.addEventListener('pointermove', e => { if (dragI === i && t.hasPointerCapture(e.pointerId)) fromY(e); });
    const end = () => { if (dragI !== i) return; dragI = null; look(0, 0); setMood('neutral'); squish(); };
    t.addEventListener('pointerup', end);
    t.addEventListener('pointercancel', end);
    t.addEventListener('keydown', e => {
      const max = CH[state.mode][i].max, v = state.vals[i];
      const map = {ArrowUp:v+1, ArrowRight:v+1, ArrowDown:v-1, ArrowLeft:v-1, PageUp:v+10, PageDown:v-10, Home:0, End:max};
      if (e.key in map){ e.preventDefault(); setVal(i, map[e.key]); }
    });
  });
  document.querySelectorAll('.step').forEach(b => {
    const i = +b.dataset.i, d = +b.dataset.d;
    let hold, rep;
    const stop = () => { clearTimeout(hold); clearInterval(rep); };
    const once = () => setVal(i, state.vals[i] + d);
    b.addEventListener('pointerdown', e => {
      if (state.phase !== 'play') return;
      e.preventDefault(); once(); lookAtTube(i);
      hold = setTimeout(() => { rep = setInterval(once, 55); }, 380);
    });
    ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, () => { stop(); look(0, 0); }));
    b.addEventListener('click', e => { if (e.detail === 0) once(); });
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
}

/* ---------- Tipp ---------- */
$('#hintBtn').addEventListener('click', () => {
  if (state.jokers <= 0 || state.phase !== 'play') return;
  state.jokers--; state.hintsUsed++;
  const chs = CH[state.mode], cur = mix(state.mode, state.vals), d0 = deltaE(cur, state.target.rgb);
  let bestMove = null;
  chs.forEach((c, i) => [1, -1].forEach(dir => {
    const v = state.vals.slice();
    v[i] = clamp(v[i] + dir * Math.round(c.max * 0.08), 0, c.max);
    if (v[i] === state.vals[i]) return;
    const gain = d0 - deltaE(mix(state.mode, v), state.target.rgb);
    if (!bestMove || gain > bestMove.gain) bestMove = {i, dir, gain};
  }));
  render();
  if (!bestMove || bestMove.gain < 0.4){ say('Du bist schon verdammt nah dran. Nur noch Feinschliff!', 3200); blop(600); return; }
  const c = chs[bestMove.i];
  const big = bestMove.gain > 6;
  say(`${big ? 'Viel ' : 'Etwas '}${bestMove.dir > 0 ? 'mehr' : 'weniger'} ${c.name}!`, 3200);
  const col = document.querySelectorAll('.tubecol')[bestMove.i];
  col.classList.remove('nudge'); void col.offsetWidth; col.classList.add('nudge');
  lookAtTube(bestMove.i); setTimeout(() => look(0, 0), 1600);
  blop(600);
});

function distWords(d){
  return d < 1 ? 'fürs Auge nicht zu unterscheiden'
    : d < 2 ? 'nur für Profis sichtbar'
    : d < 5 ? 'auf den zweiten Blick sichtbar'
    : d < 10 ? 'deutlich sichtbar'
    : 'eine andere Farbfamilie';
}
const starSvg = full => `<svg viewBox="0 0 36 36" aria-hidden="true"><path class="${full ? 'full' : 'empty'}" d="M18 3l4.6 9.6 10.4 1.4-7.6 7.3 1.9 10.4L18 26.7l-9.3 5 1.9-10.4L3 14l10.4-1.4z"/></svg>`;

$('#goBtn').addEventListener('click', () => {
  if (state.phase !== 'play') return;
  clearTimeout(memTimer);
  const yours = mix(state.mode, state.vals), target = state.target.rgb;
  const d = deltaE(yours, target);
  const raw = Math.round(100 * Math.exp(-d / 16));
  const score = Math.max(0, raw - 10 * state.hintsUsed);
  const res = {target, yours, d, raw, score, name: state.target.name, tvals: state.target.vals, yvals: state.vals.slice(), hints: state.hintsUsed, mode: state.mode};
  state.results.push(res);
  state.total += score;
  state.phase = 'reveal';
  state.memHidden = false;
  $('#memCover').hidden = true; $('#memBar').hidden = true;
  render();
  try { navigator.vibrate && navigator.vibrate(score >= 80 ? [30, 40, 30] : 25); } catch(e){}
  if (score >= 85){ setMood('grin'); squish('jump'); fanfare(); if (score >= 90) confetti([target, yours]); }
  else if (score >= 55){ setMood('happy'); squish('jump'); okSound(); }
  else { setMood('sad'); squish(); sadSound(); }
  say(score >= 85 ? 'Juhuu!' : score >= 55 ? 'Nicht schlecht!' : 'Oh nein …', 1500);
  setTimeout(() => showResult(res, true), 450);
});

function recipeTable(r){
  const chs = CH[r.mode];
  const f = (v, i) => r.mode === 'rgb' ? v : v + ' %';
  return `<table class="recipe"><thead><tr><th>Kanal</th><th>Ziel</th><th>Dein Mix</th><th>Differenz</th></tr></thead><tbody>${
    chs.map((c, i) => {
      const diff = r.yvals[i] - r.tvals[i];
      return `<tr><td><span class="sw" style="background:${c.c}"></span>${c.name}</td><td>${f(r.tvals[i])}</td><td>${f(r.yvals[i])}</td><td>${diff > 0 ? '+' : diff < 0 ? '−' : '±'}${Math.abs(diff)}</td></tr>`;
    }).join('')}</tbody></table>`;
}
function showResult(r, animate){
  const last = state.results.length >= ROUNDS;
  const stars = r.score >= 90 ? 3 : r.score >= 75 ? 2 : r.score >= 55 ? 1 : 0;
  const comment = pick(COMMENTS.find(([min]) => r.score >= min)[1]);
  let tip = '';
  if (r.mode === 'rgb'){
    let bi = 0; r.tvals.forEach((v, i) => { if (Math.abs(r.yvals[i] - v) > Math.abs(r.yvals[bi] - r.tvals[bi])) bi = i; });
    const diff = r.yvals[bi] - r.tvals[bi];
    if (Math.abs(diff) > 6) tip = `Größte Baustelle: <b>${diff < 0 ? 'zu wenig' : 'zu viel'} ${CH.rgb[bi].name}</b> (${Math.abs(diff)} Stufen).`;
  } else {
    tip = 'Bei CMYK führen oft mehrere Rezepte zum selben Ton. Schwarz (K) kann einen Teil von Cyan, Magenta und Gelb ersetzen.';
  }
  $('#sheet').innerHTML = `
    <div class="res-swatch"><div style="background:${css(r.target)}"><span>Ziel</span></div><div style="background:${css(r.yours)}"><span>Du</span></div></div>
    <div class="res-head">
      <div class="res-score"><span id="scoreNum">${animate && !reduceMotion ? 0 : r.score}</span><small> / 100</small></div>
      <div class="stars" aria-label="${stars} von 3 Sternen">${[0,1,2].map(i => starSvg(i < stars)).join('')}</div>
    </div>
    <p class="comment">${comment}</p>
    <p class="detail">„${r.name}“ · Farbabstand <b>ΔE ${de(r.d)}</b>, also ${distWords(r.d)}.${r.hints ? ` <span class="penalty">Tipp-Abzug −${10 * r.hints}</span>` : ''}</p>
    ${recipeTable(r)}
    ${tip ? `<p class="detail">${tip}</p>` : ''}
    <div class="sheet-actions"><button type="button" class="btn primary" id="nextBtn">${last ? 'Zur Endabrechnung' : 'Nächste Farbe'}</button></div>`;
  openSheet('Auswertung');
  $('#nextBtn').addEventListener('click', () => {
    blop(500);
    if (last) showEnd();
    else { state.round++; newRound(); }
  });
  $('#nextBtn').focus({preventScroll:true});
  if (animate && !reduceMotion) countUp($('#scoreNum'), r.score);
}
function countUp(el, to){
  const t0 = performance.now(), dur = 700;
  const step = n => {
    const p = Math.min(1, (n - t0) / dur);
    el.textContent = Math.round(to * (1 - (1 - p) ** 3));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

const RANKS = [
  [460, 'Lebendes Farbmessgerät'], [400, 'Druckerei-Legende'], [330, 'Pixel-Alchemist'],
  [250, 'Malkasten-Profi'], [150, 'Wandfarben-Lehrling'], [0, 'Farbenblinder Maulwurf']
];
function showEnd(){
  state.phase = 'end';
  const key = bestKey(), prevBest = best[key] || 0, isRecord = state.total > prevBest;
  if (isRecord){ best[key] = state.total; try { localStorage.setItem('farbklecks-best', JSON.stringify(best)); } catch(e){} }
  render();
  const rank = RANKS.find(([min]) => state.total >= min)[1];
  const other = state.mode === 'rgb' ? 'cmyk' : 'rgb';
  const modeName = (state.mode === 'rgb' ? 'RGB' : 'CMYK') + (state.memory ? ' mit Gedächtnis' : '');
  $('#sheet').innerHTML = `
    <p class="rank-eyebrow">Dein Titel</p>
    <h2 class="rank">${rank}</h2>
    <div class="res-head">
      <div class="res-score"><span id="scoreNum">${reduceMotion ? state.total : 0}</span><small> / ${ROUNDS * 100}</small></div>
      ${isRecord ? '<span class="badge">Neuer Rekord!</span>' : ''}
    </div>
    <div class="history">${state.results.map(r => `<div class="hist"><div class="pair"><span style="background:${css(r.target)}"></span><span style="background:${css(r.yours)}"></span></div><b>${r.score}</b></div>`).join('')}</div>
    <p class="detail">Links jeweils das Ziel, rechts dein Mix. Rekord in ${modeName}: <b>${Math.max(prevBest, state.total)}</b> Punkte.</p>
    <div class="sheet-actions two">
      <button type="button" class="btn primary" id="againBtn">Nochmal!</button>
      <button type="button" class="btn" id="switchBtn">Mit ${other === 'rgb' ? 'RGB' : 'CMYK'} spielen</button>
    </div>`;
  openSheet('Endabrechnung');
  if (!reduceMotion) countUp($('#scoreNum'), state.total);
  if (state.total >= 330){ fanfare(); confetti(state.results.map(r => r.target)); } else okSound();
  setMood(state.total >= 250 ? 'grin' : 'meh'); squish('jump');
  $('#againBtn').addEventListener('click', () => { blop(); newGame(state.mode, state.memory); });
  $('#switchBtn').addEventListener('click', () => { blop(); newGame(other, state.memory); });
  $('#againBtn').focus({preventScroll:true});
}
function openSheet(label){ $('#sheet').setAttribute('aria-label', label); $('#sheetWrap').hidden = false; }
function closeSheet(){ $('#sheetWrap').hidden = true; }

/* ---------- Konfetti ---------- */
function confetti(cols){
  if (reduceMotion) return;
  const cv = $('#confetti'), ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  const palette = cols.map(css).concat(['#00B4F0','#F0148C','#FFE500','#FF2D2D','#2BE04A','#2F6BFF']);
  const ps = Array.from({length: 140}, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * 0.45,
    vx: (Math.random() - .5) * 14, vy: -Math.random() * 15 - 5,
    r: 4 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - .5) * .4,
    c: pick(palette), blob: Math.random() < 0.4
  }));
  const t0 = performance.now();
  const frame = n => {
    const el = n - t0;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => {
      p.vy += 0.42; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, 1 - el / 2600);
      ctx.fillStyle = p.c; ctx.strokeStyle = '#1E1A2A'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      if (p.blob) ctx.arc(0, 0, p.r * .7, 0, Math.PI * 2); else ctx.rect(-p.r / 2, -p.r, p.r, p.r * 2);
      ctx.fill(); ctx.stroke(); ctx.restore();
    });
    if (el < 2600) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  requestAnimationFrame(frame);
}

/* ---------- Kopfleiste ---------- */
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.mode === state.mode) return;
  blop(); newGame(b.dataset.mode, state.memory);
  say(state.mode === 'rgb' ? 'Neues Spiel mit Licht!' : 'Neues Spiel mit Tinte!');
}));
$('#memBtn').addEventListener('click', () => {
  blop(); newGame(state.mode, !state.memory);
  say(state.memory ? 'Nur 3 Sekunden gucken! Neues Spiel.' : 'Gedächtnis aus. Neues Spiel.', 3000);
});
$('#soundBtn').addEventListener('click', () => {
  state.sound = !state.sound;
  $('#soundBtn').setAttribute('aria-pressed', state.sound);
  if (state.sound) blop(520);
});

/* ---------- Start ---------- */
function start(data){
  const s = data && data.state;
  if (s && s.target && s.vals){
    state = s;
    buildTubes(); renderTarget(); render();
    if (state.phase === 'reveal') showResult(state.results[state.results.length - 1], false);
    else if (state.phase === 'end'){ state.phase = 'reveal'; showEnd(); }
    else if (state.memory && !state.memHidden) startMemory();
  } else {
    newGame('rgb', false);
  }
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) { try { hot.snapshot(() => ({state: JSON.parse(JSON.stringify(state))})); } catch(e){} }
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
